<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>probe</title>
<style>
  html,body{margin:0;padding:0;background:#111;overflow:hidden;color:#ddd;font:12px/1.5 Consolas,monospace}
  iframe{width:1560px;height:940px;border:0;display:block}
  #res{position:fixed;left:-9999px;top:0}
</style>
</head>
<body>
<iframe id="f"></iframe>
<pre id="res">PENDING</pre>
<script>
/* 临时探针：在真实页面里模拟"改代码 → 点按钮"，用来
   ① 给需要交互才出现的面板截图；② 用 --dump-dom 把 DOM 度量结果读回来做自动断言。
   用法：?s=compile | diff | ai | aisetup | checks   &p=面板高度
   校验脚本见 tools/verify-ui.js；交稿前会删掉本文件。 */
const QS = new URLSearchParams(location.search);
const S = QS.get('s') || 'diff';
const P = QS.get('p') || '360';

const WRONG = `#include <stdio.h>

int main(void) {
    int a = 10, b = 20;
    printf("C-Learn\\n");
    printf("sum = %d\\n", a + b);
    printf("avg = %.1f\\n", (a + b) / 2.0);   // 小数位数写错了：题目要两位
    return 0;
}`;
const BROKEN = `#include <stdio.h>

int main(void) {
    int a = 10
    double avg = (a + 20) / 2.0;
    printf("avg = %.2f\\n", avg)
    return 0;
}`;

const f = document.getElementById('f');
const out = document.getElementById('res');
let url = '/?panel=' + P + '#ex-hello';
if (S.indexOf('judge') === 0) url = '/?panel=' + P + '#ex-io-sum';
if (S === 'ai' || S === 'aisetup') {
  localStorage.setItem('cls.ai.v1', JSON.stringify({
    provider: 'deepseek', baseURL: 'https://api.deepseek.com/v1',
    apiKey: S === 'ai' ? 'sk-demo-key-1234567890' : '', model: 'deepseek-chat', enabled: true
  }));
}
if (S === 'lesson') url = '/#' + (QS.get('id') || 'c-pointer');
f.src = url;

const wait = (ms) => new Promise(r => setTimeout(r, ms));

function box(el) {
  if (!el) return null;
  const r = el.getBoundingClientRect();
  return { w: Math.round(r.width), h: Math.round(r.height), x: Math.round(r.x), y: Math.round(r.y) };
}

async function run() {
  const d = f.contentDocument, w = f.contentWindow;
  await wait(700);

  if (S === 'lesson') {
    const sc = Number(QS.get('scroll') || 0);
    if (sc) d.getElementById('lessonBody').scrollTop = sc;
    await wait(200);
    out.textContent = 'RESULT=' + JSON.stringify({
      defcard: !!d.querySelector('.defcard'),
      defcardH: box(d.querySelector('.defcard')),
      tocItems: d.querySelectorAll('.toc-i').length,
      h2Numbered: d.querySelectorAll('.prose h2 .sec-n').length,
      firstH2: (d.querySelector('.prose h2') || {}).textContent,
      bodyFs: getComputedStyle(d.querySelector('.prose p')).fontSize,
      titleFs: getComputedStyle(d.querySelector('.lesson-title')).fontSize,
      plainFs: getComputedStyle(d.querySelector('.defcard-plain')).fontSize,
      panelScrollW: d.getElementById('lessonBody').scrollWidth,
      panelClientW: d.getElementById('lessonBody').clientWidth,
      overflowX: d.getElementById('lessonBody').scrollWidth - d.getElementById('lessonBody').clientWidth,
      tableWraps: d.querySelectorAll('.table-wrap').length,
      tableBox: box(d.querySelector('.table-wrap'))
    });
    return;
  }

  if (S === 'aisetup' || S === 'ai') {
    d.querySelector('.ptab[data-ptab="ai"]').click();
    await wait(300);
    out.textContent = 'RESULT=' + JSON.stringify({
      setupShown: !!d.querySelector('.ai-setup'),
      idleShown: !!d.querySelector('.ai-idle'),
      aiBadge: d.getElementById('aiBadge').textContent,
      settingsStatus: d.getElementById('aiStatus').textContent
    });
    return;
  }

  /* 环境自检页 */
  if (S === 'env') {
    d.querySelector('.act-btn[data-view="env"]').click();
    await wait(2500);                    // 里面有一次真编译，等它跑完
    out.textContent = 'RESULT=' + JSON.stringify({
      rows: d.querySelectorAll('.env-row').length,
      okRows: d.querySelectorAll('.env-row.ok').length,
      badRows: d.querySelectorAll('.env-row.bad').length,
      sum: (d.querySelector('.env-sum') || {}).textContent || '',
      fixCodes: d.querySelectorAll('.env-fix code').length
    });
    return;
  }

  /* 学习路线（进度页） */
  if (S === 'path') {
    d.querySelector('.act-btn[data-view="progress"]').click();
    await wait(300);
    out.textContent = 'RESULT=' + JSON.stringify({
      stages: d.querySelectorAll('.path-stage').length,
      nextText: (d.querySelector('.path-next') || {}).textContent || '',
      chapterBars: d.querySelectorAll('.pg-row').length,
      pathHead: (d.querySelector('.path-head') || {}).textContent || ''
    });
    return;
  }

  /* 草稿历史：改两次代码各跑一次，再打开历史 */
  if (S === 'history') {
    const ta0 = d.getElementById('codeInput');
    ta0.value = WRONG;
    ta0.dispatchEvent(new w.Event('input'));
    await wait(200);
    d.getElementById('btnCompile').click();
    await wait(1600);
    ta0.value = WRONG + '\n// 第二版';
    ta0.dispatchEvent(new w.Event('input'));
    await wait(200);
    d.getElementById('btnCompile').click();
    await wait(1600);
    d.getElementById('btnHistory').click();
    await wait(300);
    out.textContent = 'RESULT=' + JSON.stringify({
      rows: d.querySelectorAll('.hist-row').length,
      firstTime: (d.querySelector('.hist-t') || {}).textContent || '',
      modalShown: !d.getElementById('modalMask').classList.contains('hidden')
    });
    return;
  }

  /* 搜索里的问 AI 入口 */
  if (S === 'searchai') {
    d.querySelector('.act-btn[data-view="search"]').click();
    await wait(200);
    const si = d.getElementById('searchInput');
    si.value = '为什么我的链表打印不出来';
    si.dispatchEvent(new w.Event('input'));
    await wait(800);
    out.textContent = 'RESULT=' + JSON.stringify({
      hasAiBlock: !!d.querySelector('.sr-ai'),
      askLabel: (d.getElementById('srAskAi') || {}).textContent || '',
      results: d.querySelectorAll('.sr-item').length
    });
    return;
  }

  /* 多用例判题：故意只算对第一组 */
  if (S === 'judge' || S === 'judgepass') {
    const ta1 = d.getElementById('codeInput');
    ta1.value = (S === 'judgepass') ? [
      '#include <stdio.h>',
      'int main(void) {',
      '    int a, b;',
      '    if (scanf("%d %d", &a, &b) != 2) return 1;',
      '    printf("a+b = %d\\n", a + b);',
      '    printf("a-b = %d\\n", a - b);',
      '    printf("a*b = %d\\n", a * b);',
      '    printf("a/b = %d\\n", a / b);',
      '    return 0;',
      '}'
    ].join('\n') : [
      '#include <stdio.h>',
      'int main(void) {',
      '    // 只照着题目示例写死，换一组数据就露馅',
      '    printf("a+b = 22\\n");',
      '    printf("a-b = 12\\n");',
      '    printf("a*b = 85\\n");',
      '    printf("a/b = 3\\n");',
      '    return 0;',
      '}'
    ].join('\n');
    ta1.dispatchEvent(new w.Event('input'));
    await wait(250);
    d.getElementById('btnCheck').click();
    await wait(3500);
    out.textContent = 'RESULT=' + JSON.stringify({
      chips: d.querySelectorAll('.case-chip').length,
      okChips: d.querySelectorAll('.case-chip.ok').length,
      badChips: d.querySelectorAll('.case-chip.bad').length,
      sum: (d.querySelector('.case-sum') || {}).textContent || '',
      note: (d.querySelector('.case-note b') || {}).textContent || '',
      verdict: (d.querySelector('.diff-verdict b') || {}).textContent || '',
      structWarn: !!d.querySelector('.struct-warn'),
      activeTab: (d.querySelector('.ptab.active') || {}).textContent || '',
      diffBadge: d.getElementById('diffBadge').textContent,
      tableW: (box(d.querySelector('.dl-table')) || {}).w,
      viewW: (box(d.getElementById('pv-diff')) || {}).w,
      flagBox: box(d.querySelector('.dl-row .dl-flag'))
    });
    return;
  }

  const ta = d.getElementById('codeInput');
  ta.value = (S === 'compile') ? BROKEN : WRONG;
  ta.dispatchEvent(new w.Event('input'));
  await wait(250);

  if (S === 'compile') {
    d.getElementById('btnCompile').click();
    await wait(1800);
    out.textContent = 'RESULT=' + JSON.stringify({
      diagCards: d.querySelectorAll('.diag-item').length,
      banner: (d.querySelector('.diag-banner') || {}).textContent || '',
      firstTitle: (d.querySelector('.diag-title') || {}).textContent || '',
      hasWhy: !!d.querySelector('.diag-why'),
      hasFix: !!d.querySelector('.diag-fix'),
      probBadge: d.getElementById('probBadge').textContent,
      activeTab: (d.querySelector('.ptab.active') || {}).textContent || ''
    });
    return;
  }

  d.getElementById('btnCheck').click();
  await wait(2200);
  const rows = Array.from(d.querySelectorAll('.dl-row'));
  const verdict = d.querySelector('.diff-verdict');
  out.textContent = 'RESULT=' + JSON.stringify({
    rows: rows.length,
    colsPerRow: rows[0] ? rows[0].children.length : 0,
    marked: d.querySelectorAll('.dch').length,
    verdictText: verdict ? verdict.textContent : '',
    verdictBox: box(verdict),
    tableBox: box(d.querySelector('.dl-table')),
    causes: d.querySelectorAll('.diff-causes li').length,
    activeTab: (d.querySelector('.ptab.active') || {}).textContent || '',
    diffBadge: d.getElementById('diffBadge').textContent,
    flagVisible: rows[0] ? box(rows[0].querySelector('.dl-flag')) : null,
    runState: d.getElementById('runState').textContent
  });
}

f.onload = () => { run().catch(e => { out.textContent = 'ERROR=' + e.message; }); };
</script>
</body>
</html>
